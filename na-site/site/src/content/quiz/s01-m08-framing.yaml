# The items of s01-m08-framing in docs/curriculum/session-01.md.
# q01 to q06 are checks 1 to 6. The section has no segment plan, so each
# segment holds one group of related checks: 1 the byte stream (checks 1, 6),
# 2 fixed length and delimiter (checks 2, 3), 3 the length prefix (checks 4, 5).
# q07 to q09 are the pretest, asked again in the exit quiz. q10 is the POE.
items:
  - id: s01-m08-q01
    use: [check, practice]
    segment: 1
    type: mcq
    prompt: 'The sender calls write() two times, "hello" then "world". What can one read() return?'
    options:
      - text: 'Any split, such as "helloworld".'
        correct: true
        feedback: TCP keeps no edges between writes, so a read returns the bytes that arrived.
      - text: 'Always exactly "hello".'
        correct: false
        misconception: S01-M04
        feedback: TCP keeps no edges between writes. A read returns the bytes that wait, which can be part of a message or parts of two.
      - text: Always two reads, because TCP sends each write as its own segment.
        correct: false
        misconception: S01-M32
        feedback: TCP picks the segment sizes. It can split one write or merge two writes, and a read can hold bytes from several segments.
    explanation: A read returns the bytes that wait, from 1 byte up to the buffer size. So the program must find where a message ends.
    covers: [S01-C92]
    tags: []
    taughtIn: tcp-keeps-order-not-edges

  - id: s01-m08-q02
    use: [check, practice]
    segment: 2
    type: mcq
    prompt: A protocol says that every message is exactly 100 bytes. How does the reader know where a message ends?
    options:
      - text: It looks for an end marker after the 100 bytes.
        correct: false
        misconception: S01-M74
        feedback: The reader counts 100 bytes, so it needs no marker.
      - text: It counts 100 bytes. Both sides agreed on that length before they started.
        correct: true
        feedback: The length lives in the rules of the protocol, not in each message.
      - text: It uses no length at all, because a fixed size is a different kind of rule from a length.
        correct: false
        misconception: S01-M30
        feedback: The 100 is a length. Both sides agreed on it ahead of time, so no message needs to carry it.
    explanation: The number 100 is in the rules of the protocol, so the reader knows the length before the first byte arrives. A fixed length is a length rule, agreed ahead of time.
    covers: [S01-C93, S01-C94, S01-C97]
    tags: []
    taughtIn: fixed-length-is-an-agreed-length

  - id: s01-m08-q03
    use: [check, practice]
    segment: 2
    type: mcq
    prompt: What is the main risk of a delimiter?
    options:
      - text: It has no risk. It works for any bytes.
        correct: false
        misconception: S01-M31
        feedback: Data that holds the delimiter needs escaping, or the reader stops too early.
      - text: The delimiter can show up inside the data.
        correct: true
        feedback: The sender must escape the delimiter when the data holds it.
      - text: The sender must know the message size first.
        correct: false
        misconception: S01-M75
        feedback: That cost belongs to a length prefix. A delimiter lets the sender start before it knows the size.
    explanation: The reader scans for the delimiter. If the data holds the same bytes, the reader stops too early, unless the sender escapes them. SMTP ends a mail with a line that holds only a dot, so it adds a dot to a body line that starts with a dot.
    covers: [S01-C95]
    tags: []
    taughtIn: a-delimiter-marks-the-end

  - id: s01-m08-q04
    use: [check, practice]
    segment: 3
    type: numeric
    prompt: A protocol puts a 1-byte length in front of each message. What is the largest message that this length can describe?
    answer: { value: 255, tolerance: 0, unit: bytes }
    explanation: One byte holds 256 values, from 0 to 255. So the largest length that it can say is 255, and a 1-byte length caps a message at 255 bytes. Two bytes cap it at 65,535.
    covers: [S01-C96]
    tags: []
    taughtIn: seg-a-length-before-the-bytes

  - id: s01-m08-q05
    use: [check, practice]
    segment: 3
    type: multi
    prompt: Which of these mark the end of a message with a length? Pick every one that does.
    options:
      - text: The CR LF CR LF at the end of the HTTP header lines
        correct: false
        misconception: S01-M76
        feedback: The empty line is a delimiter. The reader learns the count only after it scans to the empty line.
      - text: '`Content-Length: 219` in an HTTP response'
        correct: true
        feedback: The reader reads exactly 219 body bytes.
      - text: The newline at the end of each message of a chat app
        correct: false
        misconception: S01-M76
        feedback: The newline is a delimiter. The reader learns the count only after it scans to the newline.
      - text: The 2-byte prefix `00 05` in front of `hello`
        correct: true
        feedback: The reader reads 2 bytes, gets the length 5, then reads 5 bytes.
    explanation: A length gives the reader the count before it reads. The reader finds a delimiter with a scan. Content-Length and the 2-byte prefix are lengths. The empty line and the newline are delimiters.
    covers: [S01-C95, S01-C96]
    tags: []
    taughtIn: a-length-prefix-says-how-many

  - id: s01-m08-q06
    use: [check, practice]
    segment: 1
    type: mcq
    prompt: A program calls write() one time with 10 bytes. How many TCP segments carry those bytes?
    options:
      - text: Always exactly one.
        correct: false
        misconception: S01-M32
        feedback: TCP can split or merge writes.
      - text: None, until TCP has collected many bytes.
        correct: false
        misconception: S01-M77
        feedback: TCP does not wait to collect many bytes. It can split or merge writes.
      - text: One or more, as TCP decides.
        correct: true
        feedback: TCP can send the 10 bytes in one segment, split them, or merge them with other writes.
    explanation: TCP picks the segment sizes, and the program cannot set them directly. So the edges of a write do not reach the receiver.
    covers: [S01-C92]
    tags: []
    taughtIn: seg-a-byte-stream-has-no-edges

  - id: s01-m08-q07
    use: [pretest, exit]
    type: recall
    prompt: 'A program sends "hello", and right after that it sends "world". Can the other program get "helloworld" in one read?'
    model: Yes. TCP keeps no mark between the two sends, so one read can return both words.
    explanation: A read returns the bytes that wait. The two sends can arrive as one read of 10 bytes.
    covers: [S01-C92]
    tags: []
    taughtIn: tcp-keeps-order-not-edges

  - id: s01-m08-q08
    use: [pretest, exit]
    type: recall
    prompt: A web page arrives with a few lines of notes in front of it. How does the reader know where the notes stop and the page starts?
    model: An empty line ends the notes, which HTTP calls header lines. Each line ends with the two bytes CR LF, so the reader looks for CR LF CR LF.
    explanation: The empty line is a delimiter. The reader scans for it to find where the header lines stop.
    covers: [S01-C95]
    tags: []
    taughtIn: a-delimiter-marks-the-end

  - id: s01-m08-q09
    use: [pretest, exit]
    type: recall
    prompt: One of the notes in front of a web page says how long the page is, 219 bytes. What does the reader do with that number?
    model: 'It takes exactly 219 bytes of page after the notes, then stops. HTTP writes this note as `Content-Length: 219`.'
    explanation: Content-Length is a length for the body. The reader counts the bytes, so it needs no scan.
    covers: [S01-C96]
    tags: []
    taughtIn: a-length-prefix-says-how-many

  - id: s01-m08-q10
    use: [practice]
    type: predict
    prompt: 'In a test run, a small echo server runs on a computer and reports each read. A second program, the client, on the same computer sends "hello", then "world", on one connection. How many reads did the server make for the two sends?'
    options:
      - text: Two reads of 5 bytes, one for each send.
        correct: false
        misconception: S01-M32
        feedback: In this run, the two sends arrived as one read. Another run can give two reads, but TCP does not promise one read for each send.
      - text: One read that returns all 10 bytes.
        correct: true
        feedback: That is what this run on one computer showed. Another run or a real network can split the bytes another way.
      - text: No read, until TCP has collected many bytes.
        correct: false
        misconception: S01-M77
        feedback: TCP does not wait to collect many bytes. It can split or merge writes.
    explanation: In this run on one computer, the server made one read that returned all 10 bytes. TCP kept no edge between the two sends. Another run or a real network can give other cuts.
    covers: [S01-C92]
    tags: [measured]
    taughtIn: tcp-keeps-order-not-edges
