# The gate of na-site/docs/PLAN.md section 5, checks 1 to 4.
# CI skips check 7, `npm run lint:prose`: it calls the STE linter in
# ~/.claude/skills, which is not in this repo. Run it locally.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: na-site/site
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Match the local Node (24.6.0, npm 11.5.1). A newer npm on the runner rejects the lock file:
          # it resolves nested @emnapi optional deps of the wasm32 fallback differently.
          node-version: '24.6.0'
          cache: npm
          cache-dependency-path: na-site/site/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run test
      - run: npm run verify
      - run: npm run build
