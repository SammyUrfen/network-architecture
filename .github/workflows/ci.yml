# The gate of docs/PLAN.md section 5, checks 1 to 4.
# CI skips check 7, `npm run lint:prose`: it calls the STE linter in
# ~/.claude/skills, which is not in this repo. Run it locally.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run test
      - run: npm run verify
      - run: npm run build
