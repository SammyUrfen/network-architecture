# Build na-site/site/ and publish it to https://sammyurfen.github.io/network-architecture/.
# The build also reads na-site/docs/curriculum/, so the job checks out the whole repo.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time. A new push waits and does not cancel a deploy in progress.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: withastro/action@v6
        with:
          path: na-site/site
          # Match the local Node (24.6.0, npm 11.5.1). A newer npm on the runner rejects the lock file:
          # it resolves nested @emnapi optional deps of the wasm32 fallback differently.
          node-version: '24.6.0'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
